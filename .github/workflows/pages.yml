name: Publish benchmark site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["leaderboard/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site
        run: |
          mkdir -p _site
          cp -r leaderboard/. _site/
          rm -f _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
