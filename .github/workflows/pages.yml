name: Publish benchmark site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["results/**/site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect latest site
        run: |
          mkdir -p _site
          LATEST=$(ls -d results/*/site 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST" ]; then cp -r "$LATEST"/. _site/; else echo "<h1>No results yet</h1>" > _site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
